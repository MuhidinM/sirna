[package]
name = "sirna"
version = "0.1.0"
description = "Sirna: plans the week, runs focus sessions, guards against burnout"
authors = ["Muhidin Misbah"]
edition = "2024"
rust-version = "1.90"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "sirna_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-autostart = "2.7.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
parking_lot = "0.12.5"
keyring-core = "1.0.1"
windows-native-keyring-store = { version = "1.1.0", default-features = false }
tauri-plugin-global-shortcut = "2"
tauri-winrt-notification = "0.8.1"
tauri-plugin-log = "2"
log = "0.4.35"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Plan §10: keep the build cache small on a disk with little free space.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 16
opt-level = 2
strip = true
panic = "unwind" # a panic in one job must not take the tray down (plan §4.1)
