<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Sirna: a rounded square with a straight slot cut from just past the seed
       out through the top-right corner, a check and a seed. The slot is as
       wide as the check stroke and has a round inner end. -->
  <defs>
    <mask id="slot">
      <rect width="1024" height="1024" fill="#fff"/>
      <path d="M919 203 L1150 -28" stroke="#000" stroke-width="118" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="220" fill="#ffb413" mask="url(#slot)"/>
  <path d="M296 534 L448 686 L700 432" fill="none" stroke="#141414" stroke-width="118" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="818" cy="304" r="60" fill="#141414"/>
</svg>
